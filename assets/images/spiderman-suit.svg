<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#11131f"/>

  <!-- Large Central Spider Emblem -->
  <g transform="translate(200, 200)">
    <!-- Spider Body Core -->
    <ellipse cx="0" cy="-20" rx="24" ry="34" fill="#ff2a5f" stroke="#000000" stroke-width="6"/>
    <ellipse cx="0" cy="30" rx="32" ry="46" fill="#ff2a5f" stroke="#000000" stroke-width="6"/>
    
    <!-- Top Legs -->
    <path d="M -15 -30 Q -60 -110, -140 -130 M -15 -30 Q -80 -70, -150 -50" stroke="#ff2a5f" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 15 -30 Q 60 -110, 140 -130 M 15 -30 Q 80 -70, 150 -50" stroke="#ff2a5f" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Bottom Legs -->
    <path d="M -20 20 Q -90 60, -130 140 M -20 40 Q -70 110, -110 170" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 20 20 Q 90 60, 130 140 M 20 40 Q 70 110, 110 170" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Web Mesh Background -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.15" fill="none">
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="110"/>
    <circle cx="200" cy="200" r="160"/>
    <line x1="0" y1="0" x2="400" y2="400"/>
    <line x1="400" y1="0" x2="0" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
  </g>
</svg>
