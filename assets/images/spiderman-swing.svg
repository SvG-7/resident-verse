<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="swingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131f"/>
      <stop offset="50%" stop-color="#ff2a5f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="500" height="300" fill="url(#swingGrad)"/>

  <!-- Dynamic Web Shooters Arc -->
  <path d="M 0 0 Q 200 180, 480 30" stroke="#ffffff" stroke-width="4" fill="none" stroke-dasharray="10 4"/>
  <path d="M 0 10 Q 210 190, 490 40" stroke="#00f0ff" stroke-width="2" fill="none"/>

  <!-- Spider Swinging Figure Silhouette -->
  <g transform="translate(180, 40) rotate(15)">
    <!-- Spider Chest Emblem -->
    <path d="M 60 40 L 70 70 L 60 100 L 50 70 Z" fill="#000000"/>
    <path d="M 60 60 L 10 30 M 60 60 L 110 30 M 60 70 L 0 70 M 60 70 L 120 70 M 60 80 L 15 110 M 60 80 L 105 110" stroke="#000000" stroke-width="4"/>
    
    <!-- Action Legs / Arms Angles -->
    <path d="M 60 30 Q 30 -20, -20 -10 M 60 30 Q 90 -20, 140 -10" stroke="#ff2a5f" stroke-width="12" stroke-linecap="round"/>
    <path d="M 50 90 Q 10 150, -30 180 M 70 90 Q 110 160, 150 170" stroke="#00f0ff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Speed Lines overlay -->
  <line x1="0" y1="200" x2="500" y2="150" stroke="#ffd000" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="220" x2="500" y2="170" stroke="#ff2a5f" stroke-width="3" opacity="0.8"/>
  <line x1="0" y1="250" x2="500" y2="200" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
</svg>
